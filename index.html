function render(){markers.forEach(m=>map.removeLayer(m));markers=[];let term=q.value.trim().toLowerCase();let found=DATA.filter(x=>(!region.value||x.region===region.value)&&(!status.value||x.status===status.value)&&(!term||(x.name+' '+x.region+' '+x.district+' '+x.note).toLowerCase().includes(term)));
document.getElementById('stats').innerHTML='<span class="stat"><b>'+found.length+'</b>표시 사업지</span>'+Object.keys(C).map(k=>'<span class="stat"><b>'+found.filter(x=>x.status===k).length+'</b>'+k+'</span>').join('');
document.getElementById('list').innerHTML=found.map(x=>'<div class="item" data-id="'+x.id+'"><div class="name"><span class="pill" style="background:'+C[x.status]+'">'+x.status+'</span>'+safe(x.name)+'</div><div class="sub">'+safe(x.region+' '+x.district)+' · '+(x.mw===null?'용량 확인 필요':x.mw+'MW (용량 기준 개별 확인)')+'<br>'+safe(x.note)+'</div><span class="tag">근거: '+x.sourceKey+' · 시군구 참고좌표</span></div>').join('');
found.forEach(x=>{const m=L.circleMarker([x.lat,x.lng],{radius:8,weight:2,color:'#fff',fillColor:C[x.status],fillOpacity:.93}).addTo(map);
m.bindPopup('<b>'+safe(x.name)+'</b><br>상태: '+safe(x.status)+'<br>지역: '+safe(x.region+' '+x.district)+'<br>용량: '+(x.mw??'미상')+' MW (기준 확인 필요)<br>'+safe(x.note)+'<br><b>위치 정확도:</b> '+safe(x.precision)+'<br><a href="'+x.source+'" target="_blank" rel="noopener">근거 자료 열기 ↗</a>');markers.push(m);x._marker=m});
document.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>{const x=DATA.find(d=>d.id===Number(el.dataset.id));map.setView([x.lat,x.lng],11);x._marker.openPopup();if(innerWidth<760)document.getElementById('map').scrollIntoView({behavior:'smooth'})}))}
[q,region,status].forEach(el=>el.addEventListener('input',render));render();
</script></body></html>
